[project]
name = "modern-data-platform"
version = "0.1.0"
description = "Foundation for a modern data platform project"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Your Team" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "pre-commit>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
